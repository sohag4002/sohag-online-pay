name: Build Sohag Online Payment APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Generate or Restore Permanent Keystore
        run: |
          if [ -f app/sohag-release.jks ]; then
            echo "Permanent keystore found."
          else
            echo "Generating permanent keystore..."
            keytool -genkey -v -keystore app/sohag-release.jks \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias sohag \
              -storepass sohagonline123 \
              -keypass sohagonline123 \
              -dname "CN=Sohag Online Payment, OU=Payment, O=Sohag Online, L=Dhaka, C=BD"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/sohag-release.jks
            git commit -m "chore: persist permanent release signing keystore" || true
            git push || true
          fi
          cp app/sohag-release.jks app/release.jks

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare APK Output
        run: |
          cp app/build/outputs/apk/release/app-release.apk SohagOnlinePayment-v1.0.4.apk
          ls -lh SohagOnlinePayment-v1.0.4.apk

      - name: Upload APK Artifact (Direct Download Link)
        uses: actions/upload-artifact@v4
        with:
          name: SohagOnlinePayment-v1.0.4-APK
          path: SohagOnlinePayment-v1.0.4.apk
          retention-days: 90

      - name: Create GitHub Release (Download Link)
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.4
          name: "Sohag Online Payment App v1.0.4"
          draft: false
          prerelease: false
          files: SohagOnlinePayment-v1.0.4.apk
          body: |
            ### 📱 Sohag Online Payment Gateway Android App (v1.0.4)

            **Features & Improvements:**
            - 🚀 **Triple-Redundancy SMS Engine:** Combines BroadcastReceiver (Max Priority), ContentObserver (`Telephony.Sms.CONTENT_URI`), and periodic Inbox Scanning to ensure zero missed payment messages across ALL Android devices.
            - 📱 **Universal OEM Support:** Fixes SMS broadcast delivery on Xiaomi (MIUI/HyperOS), Vivo, Oppo, Realme, Samsung, OnePlus, and Transsion (Tecno/Infinix) phones.
            - ⚡ **Auto-WakeLock & goAsync:** Prevents phone CPU from sleeping during background network sync in Doze mode.
            - 💳 **Complete Gateway Coverage:** Full support for bKash, Nagad, Rocket (16216), Upay, Cellfin, SureCash, OK Wallet, Tap, mCash, and all major Bangladeshi banks.
            - 🛡️ **Duplicate Protection:** Intelligent multi-level deduplication prevents duplicate submissions to the server.
            - 🧹 **Automatic 48-Hour Data Cleanup:** Keeps local database small, clean, and ensures lightning-fast app performance.
            - 📷 **Zero-Hassle 1-Click QR Setup:** Scan the QR code directly from your merchant dashboard.
            - 🔄 **24/7 Persistent Background Service:** Foreground service with sticky lifecycle and auto-start on reboot.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
